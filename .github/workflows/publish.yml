name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.11

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Emscripten SDK (pinned)
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 5.0.5
          "$HOME/emsdk/emsdk" activate 5.0.5

      - name: Build (wasm + js)
        run: |
          source "$HOME/emsdk/emsdk_env.sh" > /dev/null
          npm run build

      - name: Run tests
        run: npm test

      - name: Ensure version is unpublished
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::error::${PKG_NAME}@${PKG_VERSION} is already published."
            exit 1
          fi

      # Requires npm Trusted Publisher configured for this repository/workflow.
      - name: Publish to npm
        run: npm publish --access public
